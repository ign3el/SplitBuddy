name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      # SplitBuddy runs on ign3elapp as an aaPanel Node project (node index.js on
      # :3003, behind nginx), not in Docker. Express serves ../dist, which is built
      # on the VPS and is not tracked in git.
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            export PATH=/www/server/nodejs/v24.12.0/bin:$PATH
            APP=/www/wwwroot/splitbuddy
            SERVER_DIR=$APP/server
            cd "$APP"

            OLD=$(git rev-parse HEAD)
            git fetch origin main
            git merge --ff-only origin/main
            NEW=$(git rev-parse HEAD)
            echo "Deploying $OLD -> $NEW"

            CHANGED=$(git diff --name-only "$OLD" "$NEW")

            # Backend deps only when the server lockfile changed (node_modules is owned by www).
            if echo "$CHANGED" | grep -q '^server/package'; then
              (cd "$SERVER_DIR" && sudo -u www env PATH="$PATH" npm ci --omit=dev)
            fi

            # Frontend: rebuild dist when anything outside server/, workflows and docs changed.
            if [ ! -d dist ] || echo "$CHANGED" | grep -qvE '^(server/|\.github/|.*\.md$)'; then
              npm ci
              npm run build
            fi

            # Restart the aaPanel Node project: stop whatever runs from server/, then start it again.
            # The process name is "MainThread", so match on working directory, not on "node".
            for d in /proc/[0-9]*; do
              if [ "$(sudo readlink "$d/cwd" 2>/dev/null)" = "$SERVER_DIR" ]; then sudo kill "${d#/proc/}" || true; fi
            done
            for i in $(seq 1 15); do
              ss -ltn | grep -q ':3003 ' || break
              sleep 1
            done
            sudo -u www bash /www/server/nodejs/vhost/scripts/splitbuddy_dev.sh

            # Fail the run if the app does not come back.
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3003/ || true)
              if [ "$code" = "200" ]; then echo "App is up (HTTP 200)"; exit 0; fi
              sleep 2
            done
            echo "App did not return 200 after restart" >&2
            exit 1
